<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Groups - QR Attendance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/groups.css">
</head>
<body class="bg-gray-100 min-h-screen">
    <nav class="bg-blue-700 text-white p-4 shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            <a href="dashboard.html" class="text-xl font-bold">QR Attendance</a>
            <div class="space-x-4">
                <a href="dashboard.html" class="hover:text-blue-200">Dashboard</a>
                <a href="students.html" class="hover:text-blue-200">Students</a>
                <a href="groups.html" class="hover:text-blue-200">Groups</a>
                <a href="sessions.html" class="hover:text-blue-200">Sessions</a>
                <a href="reports.html" class="hover:text-blue-200">Reports</a>
                <a href="#" id="logoutBtn" class="hover:text-red-300 font-semibold">Logout</a>
            </div>
        </div>
    </nav>
    <div class="container mx-auto p-6">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold">Groups</h1>
            <a href="add-group.html" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Add Group</a>
        </div>
        <div class="bg-white rounded-lg shadow-md overflow-hidden">
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Group Name</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Description</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                    </tr>
                </thead>
                <tbody class="bg-white divide-y divide-gray-200" id="groupsTableBody">
                    <!-- Loaded dynamically -->
                </tbody>
            </table>
        </div>
    </div>
    <script src="../js/api.js"></script>
    <script src="../js/groups.js"></script>
</body>
</html>
