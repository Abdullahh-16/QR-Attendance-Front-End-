<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Details - QR Attendance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-gray-100 min-h-screen">
    <nav class="bg-blue-700 text-white p-4 shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            <a href="dashboard.html" class="text-xl font-bold">QR Attendance</a>
            <div class="space-x-4">
                <a href="dashboard.html" class="hover:text-blue-200">Dashboard</a>
                <a href="students.html" class="hover:text-blue-200">Students</a>
                <a href="groups.html" class="hover:text-blue-200">Groups</a>
                <a href="sessions.html" class="hover:text-blue-200">Sessions</a>
                <a href="reports.html" class="hover:text-blue-200">Reports</a>
                <a href="#" id="logoutBtn" class="hover:text-red-300 font-semibold">Logout</a>
            </div>
        </div>
    </nav>
    <div class="container mx-auto p-6 max-w-2xl">
        <div class="bg-white p-8 rounded-lg shadow-md flex flex-col md:flex-row items-center md:items-start space-y-6 md:space-y-0 md:space-x-8">
            <div class="flex-1 space-y-4">
                <h1 class="text-2xl font-bold mb-4">Student Information</h1>
                <div><span class="font-medium text-gray-600">Name:</span> <span id="sName" class="text-gray-900">-</span></div>
                <div><span class="font-medium text-gray-600">Code:</span> <span id="sCode" class="text-gray-900">-</span></div>
                <div><span class="font-medium text-gray-600">Group:</span> <span id="sGroup" class="text-gray-900">-</span></div>
                <div><span class="font-medium text-gray-600">Status:</span> <span id="sStatus" class="text-gray-900">-</span></div>
                <div class="pt-4">
                    <a id="editStudentLink" href="#" class="bg-blue-100 text-blue-700 px-4 py-2 rounded hover:bg-blue-200 font-medium inline-block">Edit Student</a>
                </div>
            </div>
            <div class="flex flex-col items-center">
                <h3 class="font-medium text-gray-700 mb-2">QR Code</h3>
                <div class="border-4 border-gray-200 p-2 rounded-lg bg-white">
                    <img id="qrImage" src="" alt="QR Code" class="w-48 h-48 object-contain hidden">
                    <div id="qrPlaceholder" class="w-48 h-48 flex items-center justify-center bg-gray-100 text-gray-500">Loading...</div>
                </div>
            </div>
        </div>
    </div>
    <script src="../js/api.js"></script>
    <script src="../js/students.js"></script>
</body>
</html>
