<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Group - QR Attendance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-gray-100 min-h-screen">
    <nav class="bg-blue-700 text-white p-4 shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            <a href="dashboard.html" class="text-xl font-bold">QR Attendance</a>
            <div class="space-x-4">
                <a href="dashboard.html" class="hover:text-blue-200">Dashboard</a>
                <a href="students.html" class="hover:text-blue-200">Students</a>
                <a href="groups.html" class="hover:text-blue-200">Groups</a>
                <a href="sessions.html" class="hover:text-blue-200">Sessions</a>
                <a href="reports.html" class="hover:text-blue-200">Reports</a>
                <a href="#" id="logoutBtn" class="hover:text-red-300 font-semibold">Logout</a>
            </div>
        </div>
    </nav>
    <div class="container mx-auto p-6 max-w-lg">
        <div class="bg-white p-8 rounded-lg shadow-md">
            <h1 class="text-2xl font-bold mb-6">Add New Group</h1>
            <form id="addGroupForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Group Name</label>
                    <input type="text" id="name" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border focus:border-blue-500 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Description</label>
                    <textarea id="description" rows="3" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border focus:border-blue-500 focus:ring-blue-500"></textarea>
                </div>
                <button type="submit" class="w-full py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700">
                    Add Group
                </button>
            </form>
        </div>
    </div>
    <script src="../js/api.js"></script>
    <script src="../js/groups.js"></script>
</body>
</html>
