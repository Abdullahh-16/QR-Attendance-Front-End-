<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - QR Attendance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body class="bg-gray-100 min-h-screen">
    <nav class="bg-blue-700 text-white p-4 shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            <a href="dashboard.html" class="text-xl font-bold">QR Attendance</a>
            <div class="space-x-4">
                <a href="dashboard.html" class="hover:text-blue-200">Dashboard</a>
                <a href="students.html" class="hover:text-blue-200">Students</a>
                <a href="groups.html" class="hover:text-blue-200">Groups</a>
                <a href="sessions.html" class="hover:text-blue-200">Sessions</a>
                <a href="reports.html" class="hover:text-blue-200">Reports</a>
                <a href="#" id="logoutBtn" class="hover:text-red-300 font-semibold">Logout</a>
            </div>
        </div>
    </nav>
    <div class="container mx-auto p-6">
        <h1 class="text-2xl font-bold mb-6">Welcome, Assistant</h1>
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
            <div class="bg-white p-6 rounded-lg shadow-md border-t-4 border-blue-500">
                <h3 class="text-gray-500 text-sm font-medium">Total Students</h3>
                <p class="text-3xl font-bold mt-2" id="total-students">0</p>
            </div>
            <div class="bg-white p-6 rounded-lg shadow-md border-t-4 border-purple-500">
                <h3 class="text-gray-500 text-sm font-medium">Groups</h3>
                <p class="text-3xl font-bold mt-2" id="total-groups">0</p>
            </div>
            <div class="bg-white p-6 rounded-lg shadow-md border-t-4 border-green-500">
                <h3 class="text-gray-500 text-sm font-medium">Today's Sessions</h3>
                <p class="text-3xl font-bold mt-2" id="sessions-today">0</p>
            </div>
            <div class="bg-white p-6 rounded-lg shadow-md border-t-4 border-yellow-500">
                <h3 class="text-gray-500 text-sm font-medium">Today's Attendance</h3>
                <p class="text-3xl font-bold mt-2"><span id="present-today">0</span> / <span id="total-expected">0</span></p>
            </div>
        </div>
        <div class="flex space-x-4">
            <a href="sessions.html" class="bg-blue-600 text-white px-6 py-3 rounded-lg shadow hover:bg-blue-700 font-medium">Start Session</a>
            <a href="reports.html" class="bg-gray-600 text-white px-6 py-3 rounded-lg shadow hover:bg-gray-700 font-medium">View Reports</a>
        </div>
    </div>
    <script src="../js/api.js"></script>
    <script src="../js/dashboard.js"></script>
</body>
</html>
