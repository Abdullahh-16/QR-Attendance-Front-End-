<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner - QR Attendance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/scanner.css">
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">
    <nav class="bg-blue-700 text-white p-4 shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            <a href="dashboard.html" class="text-xl font-bold">QR Attendance</a>
            <div class="space-x-4">
                <a href="dashboard.html" class="hover:text-blue-200">Dashboard</a>
                <a href="students.html" class="hover:text-blue-200">Students</a>
                <a href="groups.html" class="hover:text-blue-200">Groups</a>
                <a href="sessions.html" class="hover:text-blue-200">Sessions</a>
                <a href="reports.html" class="hover:text-blue-200">Reports</a>
                <a href="#" id="logoutBtn" class="hover:text-red-300 font-semibold">Logout</a>
            </div>
        </div>
    </nav>
    <div class="container mx-auto p-4 flex-1">
        <div class="max-w-md mx-auto">
            <div class="flex justify-between items-center mb-4">
                <h1 class="text-xl font-bold">Attendance Scanner</h1>
                <a href="sessions.html" class="bg-gray-500 text-white px-3 py-1 text-sm rounded hover:bg-gray-600">Back</a>
            </div>
            
            <div class="bg-white p-4 rounded-lg shadow-md mb-4 text-center">
                <h2 class="text-md font-medium text-gray-700 mb-2">Session: <span id="sessionIdDisplay" class="font-bold">-</span></h2>
                <div id="reader" class="mx-auto w-full bg-black rounded overflow-hidden shadow-inner min-h-[250px] flex items-center justify-center text-white text-sm">
                    <p>Camera ready...</p>
                </div>
            </div>

            <div class="bg-white p-4 rounded-lg shadow-md">
                <h3 class="text-md font-semibold mb-2">Recent Scans</h3>
                <div id="scan-results" class="space-y-2 max-h-48 overflow-y-auto">
                    <!-- Scans -->
                </div>
            </div>
        </div>
    </div>
    <script src="../js/api.js"></script>
    <script src="../js/scanner.js"></script>
</body>
</html>
